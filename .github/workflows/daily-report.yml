name: daily-stock-report
# v12.2.25 critical UI/time fix

on:
  schedule:
    # 08:00 KST Monday-Friday = 23:00 UTC Sunday-Thursday
    - cron: '0 23 * * 0-4'
    # 16:45 KST Monday-Friday = 07:45 UTC Monday-Friday
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      NOTEBOOK_FILE: 실전매매_통합시스템_v10_2_연속추천관찰_자동조건검색_드라이브준비.ipynb
      CANDIDATE_SOURCE_MODE: HYBRID
      REQUIRE_TOSS_FILE: "false"
      TOSS_MANUAL_CSV_FILE: TOSS_수동후보.csv
      HOLDINGS_CSV_FILE: holdings_manual_input.csv
      TRADE_LOG_CSV_FILE: trade_log_manual_input.csv
      USE_GOOGLE_DRIVE: "false"
      REPORT_ROOT_MODE: LOCAL
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
      DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Time guard and schedule diagnostics
        id: time_guard
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          KST_NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          KST_HM="$(TZ=Asia/Seoul date '+%H%M')"
          KST_DOW="$(TZ=Asia/Seoul date '+%u')"  # 1=Mon ... 7=Sun

          SKIP_HEAVY_JOB="false"
          REPORT_GUARD_REASON="allowed"
          REPORT_SESSION="MANUAL"
          REPORT_EXPECTED_KST="manual run"
          REPORT_EXPECTED_KIND="manual"

          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "0 23 * * 0-4" ]; then
            REPORT_SESSION="AM"
            REPORT_EXPECTED_KST="08:00 KST"
            REPORT_EXPECTED_KIND="morning"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "45 7 * * 1-5" ]; then
            REPORT_SESSION="PM"
            REPORT_EXPECTED_KST="16:45 KST"
            REPORT_EXPECTED_KIND="market_close"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REPORT_SESSION="MANUAL"
            REPORT_EXPECTED_KST="manual run"
            REPORT_EXPECTED_KIND="manual"
          else
            REPORT_SESSION="UNKNOWN"
            REPORT_EXPECTED_KST="unknown"
            REPORT_EXPECTED_KIND="unknown"
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$KST_DOW" -ge 6 ]; then
              SKIP_HEAVY_JOB="true"
              REPORT_GUARD_REASON="blocked_weekend_kst"
            elif [ "$REPORT_SESSION" = "AM" ]; then
              if [ "$KST_HM" -lt 0730 ] || [ "$KST_HM" -gt 1000 ]; then
                SKIP_HEAVY_JOB="true"
                REPORT_GUARD_REASON="blocked_stale_am_outside_0730_1000_kst"
              fi
            elif [ "$REPORT_SESSION" = "PM" ]; then
              if [ "$KST_HM" -lt 1545 ] || [ "$KST_HM" -gt 1800 ]; then
                SKIP_HEAVY_JOB="true"
                REPORT_GUARD_REASON="blocked_stale_pm_outside_1545_1800_kst"
              fi
            else
              SKIP_HEAVY_JOB="true"
              REPORT_GUARD_REASON="blocked_unknown_schedule"
            fi
          fi

          echo "event_name=$EVENT_NAME"
          echo "event_schedule=$EVENT_SCHEDULE"
          echo "utc_now=$UTC_NOW"
          echo "kst_now=$KST_NOW"
          echo "kst_hm=$KST_HM"
          echo "kst_dow=$KST_DOW"
          echo "report_session=$REPORT_SESSION"
          echo "expected_kst=$REPORT_EXPECTED_KST"
          echo "skip_heavy_job=$SKIP_HEAVY_JOB"
          echo "guard_reason=$REPORT_GUARD_REASON"

          echo "SKIP_HEAVY_JOB=$SKIP_HEAVY_JOB" >> "$GITHUB_ENV"
          echo "REPORT_GUARD_REASON=$REPORT_GUARD_REASON" >> "$GITHUB_ENV"
          echo "REPORT_SESSION=$REPORT_SESSION" >> "$GITHUB_ENV"
          echo "REPORT_EVENT_NAME=$EVENT_NAME" >> "$GITHUB_ENV"
          echo "REPORT_EVENT_SCHEDULE=$EVENT_SCHEDULE" >> "$GITHUB_ENV"
          echo "REPORT_UTC_STARTED_AT=$UTC_NOW" >> "$GITHUB_ENV"
          echo "REPORT_KST_STARTED_AT=$KST_NOW" >> "$GITHUB_ENV"
          echo "REPORT_EXPECTED_KST=$REPORT_EXPECTED_KST" >> "$GITHUB_ENV"
          echo "REPORT_EXPECTED_KIND=$REPORT_EXPECTED_KIND" >> "$GITHUB_ENV"

          mkdir -p docs/data
          {
            echo "key,value"
            echo "event_name,$EVENT_NAME"
            echo "event_schedule,$EVENT_SCHEDULE"
            echo "utc_started_at,$UTC_NOW"
            echo "kst_started_at,$KST_NOW"
            echo "kst_hm,$KST_HM"
            echo "kst_dow,$KST_DOW"
            echo "report_session,$REPORT_SESSION"
            echo "expected_kst,$REPORT_EXPECTED_KST"
            echo "expected_kind,$REPORT_EXPECTED_KIND"
            echo "skip_heavy_job,$SKIP_HEAVY_JOB"
            echo "guard_reason,$REPORT_GUARD_REASON"
          } > docs/data/latest_schedule_diagnostics.csv

      - name: Show repository files
        run: |
          pwd
          ls -la
          ls -la automation/scripts || true
          ls -la holdings_manual_input.csv trade_log_manual_input.csv || true
          echo "NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:+OK}"
          echo "NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:+OK}"
          echo "TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:+OK}"
          echo "TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:+OK}"
          echo "GEMINI_API_KEY: ${GEMINI_API_KEY:+OK}"
          echo "GEMINI_MODEL: ${GEMINI_MODEL}"

      - name: Set up Python
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate TOSS manual candidate file
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          if [ -f automation/scripts/validate_toss_csv.py ]; then
            python automation/scripts/validate_toss_csv.py "$TOSS_MANUAL_CSV_FILE"
          else
            echo "validate_toss_csv.py not found; skip"
          fi

      - name: Hotfix source notebook before runtime copy
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          if [ -f automation/scripts/hotfix_v102_series_or.py ]; then
            python automation/scripts/hotfix_v102_series_or.py "$NOTEBOOK_FILE"
          else
            echo "hotfix_v102_series_or.py not found; skip"
          fi

      - name: Prepare runtime notebook
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          if [ -f automation/scripts/patch_notebook_config.py ]; then
            python automation/scripts/patch_notebook_config.py "$NOTEBOOK_FILE" "_runtime_report.ipynb"
          else
            cp "$NOTEBOOK_FILE" "_runtime_report.ipynb"
          fi

      - name: Hotfix runtime notebook before execute
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          if [ -f automation/scripts/hotfix_v102_series_or.py ]; then
            python automation/scripts/hotfix_v102_series_or.py "_runtime_report.ipynb"
          else
            echo "hotfix_v102_series_or.py not found; skip"
          fi

      - name: Run report notebook
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          jupyter nbconvert --to notebook --execute "_runtime_report.ipynb" --output executed_report.ipynb --ExecutePreprocessor.timeout=5400

      - name: Fetch realtime holdings prices and Naver news
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/fetch_realtime_holdings_prices_and_naver_news.py

      - name: Build recommendation candidate analysis
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/build_recommendation_analysis.py

      - name: Restore legacy Excel report sections
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/publish_legacy_excel_sections.py

      - name: Build Gemini recommendation company profiles
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/build_gemini_recommendation_company_profiles.py

      - name: Check Gemini API health
        if: ${{ env.SKIP_HEAVY_JOB != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 7 * * 1-5') }}
        run: |
          python automation/scripts/check_gemini_api.py

      - name: Build Gemini holding AI briefing
        if: ${{ env.SKIP_HEAVY_JOB != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 7 * * 1-5') }}
        run: |
          python automation/scripts/build_gemini_holding_ai_briefing.py

      - name: Final UI rebuild after all AI outputs
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/publish_legacy_excel_sections.py
          python automation/scripts/force_refresh_latest.py
          python automation/scripts/build_run_manifest.py

      - name: Publish Excel download files
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          python automation/scripts/publish_excel_downloads.py

      - name: Cleanup oversized generated archives and duplicate report packages
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          echo "Remove generated zip archives and duplicate notebook package outputs before staging."
          find . -type f \( -name '*.zip' -o -name '*_automation_package_*.zip' -o -name 'html_report_package_*.zip' \) -delete || true
          rm -rf stock_report/reports stock_report/latest stock_report/docs stock_report/html stock_report/downloads || true
          find stock_report -type f \( -name '*.zip' -o -name '*.xlsx' -o -name '*.ipynb' \) -delete 2>/dev/null || true
          git rm --cached -r --ignore-unmatch '*.zip' '**/*.zip' || true
          git rm --cached -r --ignore-unmatch stock_report/reports stock_report/latest stock_report/docs stock_report/html stock_report/downloads || true

      - name: Commit generated report
        if: ${{ env.SKIP_HEAVY_JOB != 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase --autostash origin main || {
            echo "Rebase failed. Abort and continue with current generated files."
            git rebase --abort || true
          }
          find . -type f \( -name '*.zip' -o -name '*_automation_package_*.zip' -o -name 'html_report_package_*.zip' \) -delete || true
          rm -rf stock_report/reports stock_report/latest stock_report/docs stock_report/html stock_report/downloads || true
          find stock_report -type f \( -name '*.zip' -o -name '*.xlsx' -o -name '*.ipynb' \) -delete 2>/dev/null || true
          git status --short
          git add -A docs || true
          git add -A .github workflows automation .gitignore README*.md VERIFICATION_RESULT.txt || true
          for f in holdings_manual_input.csv trade_log_manual_input.csv TOSS_수동후보.csv TOSS_수동후보_예시.csv requirements.txt; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git reset -- '*.zip' '**/*.zip' '*.ipynb' '**/*.ipynb' || true
          git reset -- 'stock_report/**' || true
          git reset -- '*.xlsx' || true
          git diff --cached --name-status || true
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          git commit -m "Update daily stock report"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git pull --rebase --autostash origin main || { git rebase --abort || true; sleep 5; }
            sleep 5
          done
          exit 1

      - name: Send Telegram report alert
        if: always()
        run: |
          python automation/scripts/send_telegram_report_alert.py
